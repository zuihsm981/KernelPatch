name: Build DEV CI

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/build_dev.yml"
      - "kernel/**"
      - "version"
  workflow_dispatch:
    inputs:
      build_kpimg:
        description: 'Build kpimg (android = FP/APatch variant with ANDROID=1, linux = generic)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - linux
          - none
      build_kptools:
        description: 'Build kptools helper (stripped, no debug info)'
        required: true
        default: 'android'
        type: choice
        options:
          - both
          - android
          - linux
          - none

jobs:
  Build-kpimg:
    if: ${{ (inputs.build_kpimg || 'both') != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install Compiler
        run: |
          curl -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Build kpimg
        run: |
          set -o pipefail
          export TARGET_COMPILE=`pwd`/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
          KP="${{ inputs.build_kpimg || 'both' }}"
          cd kernel

          # Android variant (config=android,release) — used by FolkPatch/APatch
          if [ "$KP" = "both" ] || [ "$KP" = "android" ]; then
            export ANDROID=1
            make clean >/dev/null 2>&1
            make hdr kpimg 2>&1 | tee ../kpimg-build-android.log
            mv kpimg kpimg-android
            mv kpimg.elf kpimg.elf-android
            unset ANDROID
          fi

          # Generic linux variant (plus kpimg-x86)
          if [ "$KP" = "both" ] || [ "$KP" = "linux" ]; then
            make clean >/dev/null 2>&1
            make hdr kpimg 2>&1 | tee ../kpimg-build-linux.log
            mv kpimg kpimg-linux
            mv kpimg.elf kpimg.elf-linux
          fi

          make clean >/dev/null 2>&1
          cd ..

      - name: Upload kpimg artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          path: |
            kpimg-build-android.log
            kpimg-build-linux.log
            kernel/kpimg-android
            kernel/kpimg.elf-android
            kernel/kpimg-linux
            kernel/kpimg.elf-linux
            kernel/kpimg-x86
            kernel/kpimg-x86.elf
          name: kernelpatch-${{ github.sha }}
          retention-days: 14

  Build-android-kptools:
    if: contains(fromJson('["android","both"]'), inputs.build_kptools || 'android')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Make hdr
        run: |
          export TARGET_COMPILE=placeholder
          cd kernel
          make hdr

      - name: Build kptools-android
        run: |
          cd tools
          mkdir -p build/android && cd build/android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a ../..
          cmake --build .

      - name: Strip and remove debug info
        run: |
          cd tools/build/android
          LLVM_BIN=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          $LLVM_BIN/llvm-strip --strip-debug kptools
          $LLVM_BIN/llvm-objcopy --remove-section=.comment --remove-section=.note.gnu.build-id kptools
          mv kptools kptools-android
          echo "Stripped kptools-android size: $(stat -c %s kptools-android) bytes"

      - name: Upload Android kptools
        uses: actions/upload-artifact@v4
        with:
          name: kptools-android-${{ github.sha }}
          path: tools/build/android/kptools-android
          retention-days: 14

  Build-linux-kptools:
    if: contains(fromJson('["linux","both"]'), inputs.build_kptools || 'none')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Make hdr
        run: |
          export TARGET_COMPILE=placeholder
          cd kernel
          make hdr

      - name: Build kptools (linux host)
        run: |
          export ANDROID=1
          cd tools
          mkdir -p build && cd build
          cmake ..
          make

      - name: Strip and remove debug info
        run: |
          cd tools/build
          strip --strip-debug kptools
          objcopy --remove-section=.comment --remove-section=.note.gnu.build-id kptools
          mv kptools kptools-linux
          echo "Stripped kptools-linux size: $(stat -c %s kptools-linux) bytes"

      - name: Upload Linux kptools
        uses: actions/upload-artifact@v4
        with:
          name: kptools-linux-${{ github.sha }}
          path: tools/build/kptools-linux
          retention-days: 14